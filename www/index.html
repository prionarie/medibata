<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover"
    />
    <title>MediBata | Barangay Health Center</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#c62828" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container" id="appContainer">
      <div class="header" id="appHeader">
        <div class="header-left">
          <i class="fas fa-heartbeat"></i>
          <span>MediBata</span>
        </div>
        <button
          class="logout-btn hidden"
          id="logoutBtn"
          onclick="showLogoutModal()"
        >
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
      <div class="content" id="mainContent"></div>
      <div class="nav-bottom hidden" id="bottomNav"></div>
    </div>

    <div class="modal" id="logoutModal">
      <div class="modal-content">
        <h3 style="color: #c62828">Confirm Logout</h3>
        <p>Are you sure you want to log out?</p>
        <div
          class="flex-wrap"
          style="margin-top: 16px; justify-content: flex-end"
        >
          <button class="btn btn-outline" onclick="closeLogoutModal()">
            Cancel
          </button>
          <button class="btn" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>

    <div class="modal" id="confirmModal">
      <div class="modal-content" id="confirmModalContent"></div>
    </div>

    <script src="vendor/sql.js/sql-wasm.js"></script>
    <script src="db/adapter.js"></script>
    <script>
      /* ───────────────────────── Constants ───────────────────────── */

      const BMI_THRESHOLDS = {
        Toddlers: {
          underweight: 14.0,
          normal: [14.0, 17.0],
          overweight: [17.1, 18.0],
          obese: 18.0,
        },
        Preschool: {
          underweight: 13.5,
          normal: [13.5, 17.0],
          overweight: [17.1, 18.5],
          obese: 18.5,
        },
        "School Age": {
          underweight: 14.0,
          normal: [14.0, 20.0],
          overweight: [20.1, 23.0],
          obese: 23.0,
        },
        Adolescent: {
          underweight: 16.5,
          normal: [16.5, 24.0],
          overweight: [24.1, 28.0],
          obese: 28.0,
        },
      };

      const PBKDF2_ITERATIONS = 150000;
      const PBKDF2_PREFIX = "pbkdf2";

      /* ───────────────────────── Crypto ───────────────────────── */

      function _bufToB64(buf) {
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
      }
      function _b64ToBuf(b64) {
        return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;
      }

      async function hashPassword(password, iterations = PBKDF2_ITERATIONS) {
        const enc = new TextEncoder();
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const key = await crypto.subtle.importKey(
          "raw",
          enc.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveBits"],
        );
        const bits = await crypto.subtle.deriveBits(
          { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
          key,
          256,
        );
        return `${PBKDF2_PREFIX}$${iterations}$${_bufToB64(salt)}$${_bufToB64(bits)}`;
      }

      async function verifyPassword(password, stored) {
        if (typeof stored !== "string") return false;
        if (!stored.startsWith(PBKDF2_PREFIX + "$")) return stored === password;
        const [, iterStr, saltB64, hashB64] = stored.split("$");
        const iterations = parseInt(iterStr, 10);
        const enc = new TextEncoder();
        const key = await crypto.subtle.importKey(
          "raw",
          enc.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveBits"],
        );
        const bits = await crypto.subtle.deriveBits(
          {
            name: "PBKDF2",
            salt: _b64ToBuf(saltB64),
            iterations,
            hash: "SHA-256",
          },
          key,
          256,
        );
        const expected = new Uint8Array(_b64ToBuf(hashB64));
        const actual = new Uint8Array(bits);
        if (expected.length !== actual.length) return false;
        let diff = 0;
        for (let i = 0; i < expected.length; i++)
          diff |= expected[i] ^ actual[i];
        return diff === 0;
      }

      function isHashed(pw) {
        return typeof pw === "string" && pw.startsWith(PBKDF2_PREFIX + "$");
      }

      function fileToCompressedDataURL(file, maxW = 600, quality = 0.6) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas
              .getContext("2d")
              .drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = URL.createObjectURL(file);
        });
      }

      /* ───────────────────────── Helpers ───────────────────────── */

      function getAge(dob) {
        const today = new Date();
        const birth = new Date(dob);
        let age = today.getFullYear() - birth.getFullYear();
        const m = today.getMonth() - birth.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
        return age;
      }

      function getAgeLevel(dob) {
        const age = getAge(dob);
        if (age <= 3) return "Toddlers";
        if (age <= 5) return "Preschool";
        if (age <= 12) return "School Age";
        return "Adolescent";
      }

      function calculateBMI(heightCm, weightKg) {
        if (!heightCm || !weightKg || heightCm <= 0) return null;
        return (weightKg / (heightCm / 100) ** 2).toFixed(1);
      }

      function getNutritionalStatus(bmi, ageLevel) {
        const bmiVal = parseFloat(bmi);
        const t = BMI_THRESHOLDS[ageLevel];
        if (!t || !bmiVal) return "Unknown";
        if (bmiVal < t.underweight) return "Underweight";
        if (bmiVal <= t.normal[1]) return "Normal";
        if (bmiVal <= t.overweight[1]) return "Overweight";
        return "Obese";
      }

      function getStatusColor(status) {
        return (
          {
            Underweight: "#ff9800",
            Normal: "#4caf50",
            Overweight: "#f44336",
            Obese: "#b71c1c",
          }[status] || "#757575"
        );
      }

      function getProgramStatus(dateTime) {
        const now = new Date();
        const progDate = new Date(dateTime);
        if (progDate.toDateString() === now.toDateString()) return "Ongoing";
        if (progDate > now) return "Upcoming";
        return "Passed";
      }

      function getProgramStatusColor(status) {
        return (
          { Ongoing: "#4caf50", Upcoming: "#2196f3", Passed: "#9e9e9e" }[
            status
          ] || "#757575"
        );
      }

      function formatDate(dateString) {
        if (!dateString) return "";
        const date = new Date(dateString + "T00:00:00");
        const months = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];
        return `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
      }

      const SESSION_KEY = "medibata.session";

      function saveSession(user) {
        try {
          localStorage.setItem(SESSION_KEY, JSON.stringify(user));
        } catch (_) {}
      }
      function loadSession() {
        try {
          return JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
        } catch (_) {
          return null;
        }
      }
      function clearSession() {
        try {
          localStorage.removeItem(SESSION_KEY);
        } catch (_) {}
      }

      /* ───────────────────────── App state ───────────────────────── */

      let currentUser = null;
      let currentScreen = "login";

      (async () => {
        try {
          await DB.init();
        } catch (e) {
          console.error("DB init failed:", e);
        }

        // Restore session
        const sess = loadSession();
        if (sess && sess.role && sess.userId) {
          const db = await DB.get();
          if (sess.role === "admin") {
            const admin = db.admins.find((a) => a.id === sess.userId);
            if (admin) {
              currentUser = { role: "admin", data: admin };
              currentScreen = "dashboard";
            } else clearSession();
          } else if (sess.role === "parent") {
            const parent = db.parents.find((p) => p.id === sess.userId);
            if (parent && parent.verified) {
              currentUser = { role: "parent", data: parent };
              currentScreen = "parentChildren";
            } else clearSession();
          }
        }

        renderApp();
      })();

      function renderApp() {
        const logoutBtn = document.getElementById("logoutBtn");
        const bottomNav = document.getElementById("bottomNav");

        if (!currentUser) {
          logoutBtn.classList.add("hidden");
          bottomNav.classList.add("hidden");
          renderLogin();
          return;
        }

        logoutBtn.classList.remove("hidden");
        bottomNav.classList.remove("hidden");

        if (currentUser.role === "admin") {
          renderAdminNav();
          switch (currentScreen) {
            case "dashboard":
              return renderAdminDashboard();
            case "children":
              return renderChildrenProfiles();
            case "nutrition":
              return renderNutritionPlans();
            case "programs":
              return renderHealthPrograms();
            case "parents":
              return renderParentAccounts();
            case "account":
              return renderAccountSettings();
            case "pending":
              return renderPendingUpdates();
            default:
              return renderAdminDashboard();
          }
        } else {
          renderParentNav();
          switch (currentScreen) {
            case "parentChildren":
              return renderParentChildrenView();
            case "parentPlans":
              return renderParentNutritionView();
            case "parentPrograms":
              return renderParentProgramsView();
            case "parentAccount":
              return renderParentAccountSettings();
            default:
              return renderParentChildrenView();
          }
        }
      }

      function navigate(screen) {
        currentScreen = screen;
        renderApp();
      }

      /* ───────────────────────── Login / signup ───────────────────────── */

      function renderLogin() {
        document.getElementById("mainContent").innerHTML = `
    <div style="padding:20px 0;">
      <div class="card" style="text-align:center;">
        <i class="fas fa-heartbeat" style="font-size:3rem; color:#c62828;"></i>
        <h2 style="color:#c62828; margin:10px 0;">MediBata</h2>
        <p style="color:#666;">Barangay Health Center</p>
      </div>
      <div class="card" style="margin-top:16px;">
        <select class="input-field" id="roleSelect" onchange="toggleLoginForm()">
          <option value="admin">Barangay Health Worker</option>
          <option value="parent">Parent/Guardian</option>
        </select>
        <input id="loginIdentifier" class="input-field" placeholder="Username">
        <input id="loginPassword" type="password" class="input-field" placeholder="Password">
        <button class="btn" style="width:100%;" onclick="login()">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
        <p id="signupLink" style="margin-top:12px; text-align:center; display:none;">
          Don't have an account? <a href="#" onclick="renderSignup(); return false;" style="color:#c62828; font-weight:600;">Sign Up</a>
        </p>
      </div>
      <div class="card" id="demoCard" style="margin-top:12px; background:#fce4ec;"></div>
    </div>`;
        toggleLoginForm();
      }

      function toggleLoginForm() {
        const role = document.getElementById("roleSelect")?.value;
        const identifier = document.getElementById("loginIdentifier");
        const signupLink = document.getElementById("signupLink");
        const demoCard = document.getElementById("demoCard");
        if (role === "admin") {
          if (identifier) identifier.placeholder = "Username";
          if (signupLink) signupLink.style.display = "none";
          if (demoCard)
            demoCard.innerHTML = `<p style="font-weight:600; color:#c62828;">Demo Admin:</p><p style="font-size:0.85rem;"><strong>Username:</strong> admin<br><strong>Password:</strong> admin123</p>`;
        } else {
          if (identifier) identifier.placeholder = "Email or Contact Number";
          if (signupLink) signupLink.style.display = "block";
          if (demoCard)
            demoCard.innerHTML = `<p style="font-weight:600; color:#c62828;">Demo Parent:</p><p style="font-size:0.85rem;"><strong>Email:</strong> juan@email.com<br><strong>Password:</strong> parent123</p>`;
        }
      }

      function renderSignup() {
        document.getElementById("mainContent").innerHTML = `
    <div class="card">
      <h3 style="color:#c62828;">Parent/Guardian Sign Up</h3>
      <input id="signFirstName" class="input-field" placeholder="First Name *" required>
      <input id="signMiddle" class="input-field" placeholder="Middle Name (optional)">
      <input id="signLastName" class="input-field" placeholder="Last Name *" required>
      <select id="signParentType" class="input-field">
        <option value="">Select Parent Type</option>
        <option>Mother</option><option>Father</option><option>Guardian</option>
      </select>
      <select id="signSex" class="input-field">
        <option>Male</option><option>Female</option>
      </select>
      <input id="signDob" type="date" class="input-field" onchange="computeAgeSignup()">
      <input id="signAge" class="input-field" placeholder="Age" readonly>
      <input id="signOccupation" class="input-field" placeholder="Occupation">
      <input id="signEmail" class="input-field" placeholder="Email (optional)">
      <input id="signContact" class="input-field" placeholder="Contact Number" required>
      <input id="signAddress" class="input-field" placeholder="Address">
      <input id="signPassword" type="password" class="input-field" placeholder="Password" oninput="checkPasswordStrength()">
      <div class="strength-bar"><div class="strength-fill" id="strengthFill" style="width:0%;"></div></div>
      <p id="strengthText" class="text-small"></p>
      <input id="signConfirmPassword" type="password" class="input-field" placeholder="Confirm Password">
      <button class="btn" style="width:100%;" onclick="registerParent()">Register</button>
      <button class="btn btn-outline" style="width:100%; margin-top:8px;" onclick="renderLogin()">Back to Login</button>
    </div>`;
      }

      window.computeAgeSignup = function () {
        const dob = document.getElementById("signDob").value;
        if (dob) document.getElementById("signAge").value = getAge(dob);
      };

      window.checkPasswordStrength = function () {
        const pwd = document.getElementById("signPassword")?.value || "";
        const fill = document.getElementById("strengthFill");
        const text = document.getElementById("strengthText");
        let strength = 0;
        if (pwd.length >= 8) strength++;
        if (/[A-Z]/.test(pwd)) strength++;
        if (/[a-z]/.test(pwd)) strength++;
        if (/[0-9]/.test(pwd)) strength++;
        const colors = ["#f44336", "#ff9800", "#ffeb3b", "#4caf50"];
        const texts = ["Weak", "Fair", "Good", "Strong"];
        const width = strength > 0 ? (strength / 4) * 100 : 0;
        if (fill) {
          fill.style.width = width + "%";
          fill.style.background =
            strength > 0 ? colors[strength - 1] : "#e0e0e0";
        }
        if (text) text.textContent = strength > 0 ? texts[strength - 1] : "";
      };

      window.login = async function () {
        const role = document.getElementById("roleSelect").value;
        const identifier = document
          .getElementById("loginIdentifier")
          .value.trim();
        const password = document.getElementById("loginPassword").value;
        const db = await DB.get();

        if (role === "admin") {
          const admin = db.admins.find((a) => a.username === identifier);
          if (!admin) return alert("Invalid admin credentials");
          if (!(await verifyPassword(password, admin.password)))
            return alert("Invalid admin credentials");
          if (!isHashed(admin.password)) {
            admin.password = await hashPassword(password);
            await DB.set(db);
          }
          currentUser = { role: "admin", data: admin };
          saveSession({ role: "admin", userId: admin.id });
          navigate("dashboard");
        } else {
          const parent = db.parents.find(
            (p) => p.email === identifier || p.contactNumber === identifier,
          );
          if (!parent) return alert("Account not found.");
          if (!(await verifyPassword(password, parent.password)))
            return alert("Invalid password.");
          if (!parent.verified)
            return alert(
              "Your account is pending verification or has been discarded.",
            );
          if (!isHashed(parent.password)) {
            parent.password = await hashPassword(password);
            await DB.set(db);
          }
          currentUser = { role: "parent", data: parent };
          saveSession({ role: "parent", userId: parent.id });
          navigate("parentChildren");
        }
      };

      window.registerParent = async function () {
        const password = document.getElementById("signPassword").value;
        const confirm = document.getElementById("signConfirmPassword").value;
        if (password !== confirm) return alert("Passwords do not match");
        if (password.length < 8)
          return alert("Password must be at least 8 characters");
        if (!/[A-Z]/.test(password))
          return alert("Password must contain uppercase letter");
        if (!/[a-z]/.test(password))
          return alert("Password must contain lowercase letter");
        if (!/[0-9]/.test(password))
          return alert("Password must contain a number");

        const first = document.getElementById("signFirstName").value.trim();
        const last = document.getElementById("signLastName").value.trim();
        const contact = document.getElementById("signContact").value.trim();
        if (!first || !last || !contact)
          return alert(
            "First name, last name, and contact number are required.",
          );

        const newParent = {
          id: "p_" + Date.now(),
          firstName: first,
          middleName: document.getElementById("signMiddle").value,
          lastName: last,
          parentType: document.getElementById("signParentType").value,
          sex: document.getElementById("signSex").value,
          dob: document.getElementById("signDob").value,
          age: parseInt(document.getElementById("signAge").value) || 0,
          occupation: document.getElementById("signOccupation").value,
          email: document.getElementById("signEmail").value,
          contactNumber: contact,
          address: document.getElementById("signAddress").value,
          password: await hashPassword(password),
          verified: false,
          childrenIds: [],
        };

        const ok = await safeMutate((db) => {
          db.pendingParents.push(newParent);
        });
        if (!ok) return alert("Could not save registration.");
        alert("Registration successful! Please wait for admin verification.");
        renderLogin();
      };

      /* ───────────────────────── Logout ───────────────────────── */

      window.showLogoutModal = () =>
        document.getElementById("logoutModal").classList.add("active");
      window.closeLogoutModal = () =>
        document.getElementById("logoutModal").classList.remove("active");
      window.logout = () => {
        currentUser = null;
        currentScreen = "login";
        clearSession();
        document.getElementById("logoutModal").classList.remove("active");
        renderApp();
      };

      function showConfirm(title, message, onConfirm) {
        document.getElementById("confirmModalContent").innerHTML = `
    <h3 style="color:#c62828;">${title}</h3>
    <p>${message}</p>
    <div class="flex-wrap" style="margin-top:16px; justify-content:flex-end;">
      <button class="btn btn-outline" onclick="document.getElementById('confirmModal').classList.remove('active')">Cancel</button>
      <button class="btn btn-danger" id="confirmBtn">Confirm</button>
    </div>`;
        document.getElementById("confirmModal").classList.add("active");
        document.getElementById("confirmBtn").onclick = () => {
          document.getElementById("confirmModal").classList.remove("active");
          onConfirm();
        };
      }

      /* ───────────────────────── Nav ───────────────────────── */

      function renderAdminNav() {
        document.getElementById("bottomNav").innerHTML = `
    <div class="nav-item ${currentScreen === "dashboard" ? "active-nav" : ""}" onclick="navigate('dashboard')"><i class="fas fa-chart-pie"></i></div>
    <div class="nav-item ${currentScreen === "children" ? "active-nav" : ""}" onclick="navigate('children')"><i class="fas fa-child"></i></div>
    <div class="nav-item ${currentScreen === "nutrition" ? "active-nav" : ""}" onclick="navigate('nutrition')"><i class="fas fa-apple-alt"></i></div>
    <div class="nav-item ${currentScreen === "programs" ? "active-nav" : ""}" onclick="navigate('programs')"><i class="fas fa-calendar-alt"></i></div>
    <div class="nav-item ${currentScreen === "parents" ? "active-nav" : ""}" onclick="navigate('parents')"><i class="fas fa-users"></i></div>
    <div class="nav-item ${currentScreen === "pending" ? "active-nav" : ""}" onclick="navigate('pending')"><i class="fas fa-clock"></i></div>`;
      }

      function renderParentNav() {
        document.getElementById("bottomNav").innerHTML = `
    <div class="nav-item ${currentScreen === "parentChildren" ? "active-nav" : ""}" onclick="navigate('parentChildren')"><i class="fas fa-child"></i></div>
    <div class="nav-item ${currentScreen === "parentPlans" ? "active-nav" : ""}" onclick="navigate('parentPlans')"><i class="fas fa-utensils"></i></div>
    <div class="nav-item ${currentScreen === "parentPrograms" ? "active-nav" : ""}" onclick="navigate('parentPrograms')"><i class="fas fa-calendar-check"></i></div>
    <div class="nav-item ${currentScreen === "parentAccount" ? "active-nav" : ""}" onclick="navigate('parentAccount')"><i class="fas fa-cog"></i></div>`;
      }

      /* ───────────────────────── Admin dashboard ───────────────────────── */

      async function renderAdminDashboard() {
        const db = await DB.get();
        const children = db.children;
        const stats = { Normal: 0, Underweight: 0, Overweight: 0, Obese: 0 };
        children.forEach((c) => {
          const last = c.measurements.slice(-1)[0];
          if (last) stats[last.status] = (stats[last.status] || 0) + 1;
        });
        const total = children.length || 1;

        document.getElementById("mainContent").innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div class="stat-card"><i class="fas fa-user-md" style="color:#c62828;"></i><h3>${db.admins.length}</h3><small>Health Workers</small></div>
      <div class="stat-card"><i class="fas fa-users" style="color:#c62828;"></i><h3>${db.parents.length}</h3><small>Parents</small></div>
      <div class="stat-card"><i class="fas fa-child" style="color:#c62828;"></i><h3>${children.length}</h3><small>Children</small></div>
      <div class="stat-card"><i class="fas fa-chart-bar" style="color:#c62828;"></i><h3>${Object.values(stats).reduce((a, b) => a + b, 0)}</h3><small>Records</small></div>
    </div>
    <div class="card">
      <h4 style="color:#c62828; margin-bottom:12px;">Nutritional Status Distribution</h4>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${[
          ["Normal", "#4caf50", "badge-green"],
          ["Underweight", "#ff9800", "badge-yellow"],
          ["Overweight", "#f44336", "badge-orange"],
          ["Obese", "#b71c1c", "badge-red"],
        ]
          .map(
            ([label, color, cls]) => `
          <div style="display:flex; justify-content:space-between;">
            <span><span class="badge ${cls}">${label}</span></span>
            <span>${stats[label] || 0} children</span>
          </div>
          <div style="background:#e0e0e0; border-radius:10px; height:8px;">
            <div style="background:${color}; height:100%; width:${((stats[label] || 0) / total) * 100}%; border-radius:10px;"></div>
          </div>`,
          )
          .join("")}
      </div>
    </div>
    <div class="card">
      <h4 style="color:#c62828; margin-bottom:8px;">Quick Actions</h4>
      <div class="flex-wrap">
        <button class="btn btn-small" onclick="navigate('children')"><i class="fas fa-child"></i> Children</button>
        <button class="btn btn-small" onclick="navigate('nutrition')"><i class="fas fa-apple-alt"></i> Plans</button>

      window.updateAccount = async function () {
        const db = await DB.get();
        const admin = db.admins.find((a) => a.id === currentUser.data.id);
        if (!admin) return alert("Admin not found");
        admin.email = document.getElementById("accEmail").value;
        admin.fullName = document.getElementById("accFullName").value;
        admin.position = document.getElementById("accPosition").value;
        currentUser.data = admin;
        await DB.set(db);
        alert("Account updated successfully");
      };

      window.updatePassword = async function () {
        const current = document.getElementById("currentPass").value;
        const newPass = document.getElementById("newPass").value;
        const confirm = document.getElementById("confirmNewPass").value;
        if (!(await verifyPassword(current, currentUser.data.password)))
          return alert("Current password incorrect");
        if (newPass !== confirm) return alert("Passwords do not match");
        if (newPass.length < 8) return alert("Minimum 8 characters");

        const db = await DB.get();
        const admin = db.admins.find((a) => a.id === currentUser.data.id);
        admin.password = await hashPassword(newPass);
        currentUser.data = admin;
        await DB.set(db);
        alert("Password updated successfully");
      };

      window.updateParentPassword = async function () {
        const current = document.getElementById("pCurrentPass").value;
        const newPass = document.getElementById("pNewPass").value;
        const confirm = document.getElementById("pConfirmPass").value;
        if (!(await verifyPassword(current, currentUser.data.password)))
          return alert("Current password incorrect");
        if (newPass !== confirm) return alert("Passwords do not match");
        if (newPass.length < 8) return alert("Minimum 8 characters");

        const db = await DB.get();
        const parent = db.parents.find((p) => p.id === currentUser.data.id);
        parent.password = await hashPassword(newPass);
        currentUser.data = parent;
        await DB.set(db);
        alert("Password updated successfully");
      };

    </div>`;
        } else {
          db.pendingUpdates.forEach((update, idx) => {

            const parent = db.parents.find((p) => p.id === update.parentId);
            html += `<div class="card">
        <strong>${child ? child.firstName + " " + child.lastName : "Unknown Child"}</strong>

          <br>

          ${update.weightPhotoKey ? `<button class="btn btn-small btn-outline mt-2" onclick="viewImage('${update.weightPhotoKey}', 'Weight Evidence')"><i class="fas fa-image"></i> View Weight Photo</button>` : '<p style="color:#999;">No weight photo</p>'}

        </div>

          <button class="btn btn-small btn-success" onclick="approveUpdate(${idx})"><i class="fas fa-check"></i> Approve</button>

      </div>`;
          });
        }

        html += `<button class="btn btn-outline mt-2" onclick="navigate('dashboard')"><i class="fas fa-arrow-left"></i> Back to Dashboard</button>`;

      window.viewImage = async function (photoKey, title) {
        const modalContent = document.getElementById("confirmModalContent");
        modalContent.innerHTML = `<h3 style="color:#c62828;">${title}</h3><p>Loading…</p>`;
        document.getElementById("confirmModal").classList.add("active");
        const dataUrl = await PhotoStore.get(photoKey);
        if (!dataUrl) {
          modalContent.innerHTML = `
            <h3 style="color:#c62828;">${title}</h3>
            <p>Photo not found (may have been cleared).</p>
            <button class="btn" onclick="document.getElementById('confirmModal').classList.remove('active')">Close</button>`;
          return;
        }
        modalContent.innerHTML = `
          <h3 style="color:#c62828;">${title}</h3>
          <div style="text-align:center; margin:16px 0;">
            <img src="${dataUrl}" alt="${title}" style="max-width:100%; max-height:60vh; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.15);" />
          </div>
          <button class="btn" onclick="document.getElementById('confirmModal').classList.remove('active')">Close</button>`;
      };

      window.approveUpdate = async function (idx) {
        const result = await safeMutate((db) => {
          const update = db.pendingUpdates[idx];
          if (!update) return;
          const child = db.children.find((c) => c.id === update.childId);
          if (child) {
            const bmi = calculateBMI(update.height, update.weight);
            child.measurements.push({
              date: update.date,
              height: update.height,
              weight: update.weight,
              bmi,
              status: getNutritionalStatus(bmi, child.ageLevel),
              heightPhotoKey: update.heightPhotoKey || null,
              weightPhotoKey: update.weightPhotoKey || null,
            });
          }
          db.pendingUpdates.splice(idx, 1);
        });
        if (!result) return;
        renderPendingUpdates();
      };

      window.denyUpdate = async function (idx) {
        const snapshot = await DB.get();
        const update = snapshot.pendingUpdates[idx];
        const result = await safeMutate((db) => {
          db.pendingUpdates.splice(idx, 1);
        });
        if (!result) return;
        try {
          if (update?.heightPhotoKey)
            await PhotoStore.del(update.heightPhotoKey);
          if (update?.weightPhotoKey)
            await PhotoStore.del(update.weightPhotoKey);
        } catch (e) {
          console.warn("Photo cleanup failed:", e);
        }
        renderPendingUpdates();
      };

      async function renderNutritionPlans() {
        const db = await DB.get();
        const grouped = {};
        db.nutritionPlans.forEach((p) => {
          const ages = p.ageLevels || [];
          ages.forEach((age) => {
            if (!grouped[age]) grouped[age] = [];
            if (!grouped[age].find((x) => x.id === p.id)) grouped[age].push(p);
          });
        });

          html += `<div class="card"><p>No pending accounts.</p></div>`;
        } else {
          db.pendingParents.forEach((p) => {
            html += `<div class="card">
        <strong>${p.firstName} ${p.lastName}</strong>
        <p style="margin:4px 0;">${p.parentType} • ${p.contactNumber}</p>
        <div class="flex-wrap">
          <button class="btn btn-small" onclick="viewParentProfile('${p.id}', true)"><i class="fas fa-eye"></i></button>
          <button class="btn btn-small btn-success" onclick="verifyParent('${p.id}')"><i class="fas fa-check"></i> Verify</button>
          <button class="btn btn-small btn-danger" onclick="discardParent('${p.id}')"><i class="fas fa-times"></i> Discard</button>
        </div>
      </div>`;
          });
        }

        document.getElementById("mainContent").innerHTML = html;
      }

      window.deleteParent = function (pid) {
        showConfirm(
          "Delete Parent Account",
          "Are you sure you want to delete this parent account?",
          async () => {
            const result = await safeMutate((db) => {
              db.parents = db.parents.filter((p) => p.id !== pid);
            });
            if (!result) return;
            navigate("parents");
          },
        );
      };

      window.verifyParent = async function (pid) {
        const result = await safeMutate((db) => {
          const idx = db.pendingParents.findIndex((p) => p.id === pid);
          if (idx > -1) {
            const parent = db.pendingParents.splice(idx, 1)[0];
            parent.verified = true;
            db.parents.push(parent);
          }
        });
        if (!result) return;
        navigate("parents");
      };

      window.discardParent = function (pid) {
        showConfirm(
          "Discard Account",
          "Are you sure you want to discard this pending account?",
          async () => {
            const result = await safeMutate((db) => {
              db.pendingParents = db.pendingParents.filter((p) => p.id !== pid);
            });
            if (!result) return;
            navigate("parents");
          },
        );
      };

      async function viewParentProfile(pid, isPending = false) {
        const db = await DB.get();
        const parent = (isPending ? db.pendingParents : db.parents).find(
          (p) => p.id === pid,
        );
        if (!parent) return;

        document.getElementById("mainContent").innerHTML = `
    <div class="card">
      <h3 style="color:#c62828;">${parent.firstName} ${parent.lastName}</h3>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0;">
        <div><strong>Type:</strong> ${parent.parentType}</div>
        <div><strong>Sex:</strong> ${parent.sex}</div>
        <div><strong>Birthdate:</strong> ${parent.dob}</div>
        <div><strong>Age:</strong> ${parent.age}</div>
        <div><strong>Occupation:</strong> ${parent.occupation}</div>
        <div><strong>Contact:</strong> ${parent.contactNumber}</div>
      </div>
      <p><strong>Email:</strong> ${parent.email || "N/A"}</p>
      <p><strong>Address:</strong> ${parent.address}</p>
      <p><strong>Status:</strong> <span class="badge ${parent.verified ? "badge-green" : "badge-yellow"}">${parent.verified ? "Verified" : "Pending"}</span></p>
      <button class="btn btn-outline mt-2" onclick="navigate('parents')"><i class="fas fa-arrow-left"></i> Back</button>
    </div>`;
      }

      /* ───────────────────────── Parent views ───────────────────────── */

      async function renderParentChildrenView() {
        const db = await DB.get();
        const children = db.children.filter((c) =>
          currentUser.data.childrenIds.includes(c.id),
        );

        let html = `<h3 style="color:#c62828;">My Children</h3>`;
        if (children.length === 0) {
          html += `<div class="card"><p>No children registered yet.</p></div>`;
        } else {
          children.forEach((c) => {
            const last = c.measurements.slice(-1)[0];
            const childAge = getAge(c.dob);
            html += `<div class="card">
        <strong style="font-size:1.1rem;">${c.firstName} ${c.lastName}</strong>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:8px 0;">
          <div><strong>Age:</strong> ${childAge}</div>
          <div><strong>Sex:</strong> ${c.sex}</div>
        </div>
        ${
          last
            ? `<div style="background:#fce4ec; padding:10px; border-radius:12px;">
            <strong>Current:</strong> ${last.height} cm • ${last.weight} kg • BMI ${last.bmi}<br>
            Status: <span class="badge" style="background:${getStatusColor(last.status)}; color:white;">${last.status}</span>
          </div>`
            : "<p>No measurements yet</p>"
        }
        <div class="flex-wrap mt-2">
          <button class="btn btn-small" onclick="parentUpdateChild('${c.id}')"><i class="fas fa-edit"></i> Update</button>
          <button class="btn btn-small btn-outline" onclick="viewMeasurementHistory('${c.id}')"><i class="fas fa-history"></i> History</button>
        </div>
      </div>`;
          });
        }
        document.getElementById("mainContent").innerHTML = html;
      }

      async function parentUpdateChild(childId) {
        const db = await DB.get();
        const child = db.children.find((c) => c.id === childId);
        if (!child) return;
        const last = child.measurements.slice(-1)[0];

        document.getElementById("mainContent").innerHTML = `
    <div class="card">
      <h3 style="color:#c62828;">Update Measurements for ${child.firstName}</h3>
      <label style="font-weight:600;">Height (cm)</label>
      <input id="puHeight" type="number" class="input-field" placeholder="Height" step="0.1" value="${last ? last.height : ""}">
      <label style="font-weight:600;">Height Photo Evidence</label>
      <input type="file" class="input-field" accept="image/*" id="puHeightPhoto">
      <label style="font-weight:600;">Weight (kg)</label>
      <input id="puWeight" type="number" class="input-field" placeholder="Weight" step="0.1" value="${last ? last.weight : ""}">
      <label style="font-weight:600;">Weight Photo Evidence</label>
      <input type="file" class="input-field" accept="image/*" id="puWeightPhoto">
      <label style="font-weight:600;">Date</label>
      <input id="puDate" type="date" class="input-field">
      <div class="flex-wrap mt-2">
        <button class="btn" onclick="submitParentUpdate('${childId}')"><i class="fas fa-paper-plane"></i> Submit</button>
        <button class="btn btn-outline" onclick="navigate('parentChildren')"><i class="fas fa-arrow-left"></i> Back</button>
      </div>
    </div>`;
      }

      window.submitParentUpdate = async function (childId) {
        const height = parseFloat(document.getElementById("puHeight").value);
        const weight = parseFloat(document.getElementById("puWeight").value);
        const date = document.getElementById("puDate").value;
        const heightFile = document.getElementById("puHeightPhoto").files[0];
        const weightFile = document.getElementById("puWeightPhoto").files[0];

        if (!height || !weight || !date)
          return alert("Please fill all measurement fields");
        if (!heightFile && !weightFile)
          return alert("Please attach at least one photo evidence");

        let heightPhotoKey = null;
        let weightPhotoKey = null;
        try {
          if (heightFile) {
            const dataUrl = await fileToCompressedDataURL(heightFile);
            heightPhotoKey = newPhotoKey();
            await PhotoStore.put(heightPhotoKey, dataUrl);
          }
          if (weightFile) {
            const dataUrl = await fileToCompressedDataURL(weightFile);
            weightPhotoKey = newPhotoKey();
            await PhotoStore.put(weightPhotoKey, dataUrl);
          }
        } catch (e) {
          console.error("Photo store failed:", e);
          return alert("Could not save the photo. Try a smaller image.");
        }

        const result = await safeMutate((db) => {
          db.pendingUpdates.push({
            childId,
            height,
            weight,
            date,
            heightPhotoKey,
            weightPhotoKey,
            parentId: currentUser.data.id,
          });
        });
        if (!result) {
          if (heightPhotoKey) await PhotoStore.del(heightPhotoKey);
          if (weightPhotoKey) await PhotoStore.del(weightPhotoKey);
          return alert("Could not submit update.");
        }
        alert("Measurement update submitted for admin review");
        navigate("parentChildren");
      };

      async function renderParentNutritionView() {
        const db = await DB.get();
        const children = db.children.filter((c) =>
          currentUser.data.childrenIds.includes(c.id),
        );
        let html = `<h3 style="color:#c62828;">Nutrition Plans</h3>`;
        let found = false;

        children.forEach((c) => {
          const last = c.measurements.slice(-1)[0];
          if (!last) return;

          const plans = db.nutritionPlans.filter((p) => {
            const ages = p.ageLevels || (p.ageLevel ? [p.ageLevel] : []);
            const statuses =
              p.nutritionalStatuses ||
              (p.nutritionalStatus ? [p.nutritionalStatus] : []);
            const ageMatch = Array.isArray(ages) && ages.includes(c.ageLevel);
            const statusMatch =
              Array.isArray(statuses) && statuses.includes(last.status);
            return ageMatch && statusMatch;
          });

          if (plans.length > 0) {
            found = true;
            plans.forEach((plan) => {
              const statuses = plan.nutritionalStatuses ||
                plan.nutritionalStatus || ["Normal"];
              const statusText = Array.isArray(statuses)
                ? statuses.join(", ")
                : statuses;

              html += `<div class="card" style="margin-bottom:8px;">
          <strong style="color:#c62828;">${c.firstName}'s Nutrition Plan</strong>
          <p style="margin:4px 0;"><strong>Date:</strong> ${formatDate(plan.weekStart)} to ${formatDate(plan.weekEnd)}</p>
          <p style="margin:4px 0;"><strong>Nutritional Status:</strong> ${statusText}</p>
          <button class="btn btn-small" onclick="viewPlan('${plan.id}')"><i class="fas fa-eye"></i> View Plan</button>
        </div>`;
            });
          }
        });

        if (!found)
          html += `<div class="card"><p>No nutrition plans assigned yet.</p></div>`;
        document.getElementById("mainContent").innerHTML = html;
      }

      async function renderParentProgramsView() {
        const db = await DB.get();
        const children = db.children.filter((c) =>
          currentUser.data.childrenIds.includes(c.id),
        );
        let html = `<h3 style="color:#c62828;">Health Programs</h3>`;
        let found = false;

        db.healthPrograms.forEach((prog) => {
          const ages = prog.ageLevels || (prog.ageLevel ? [prog.ageLevel] : []);
          const statuses =
            prog.nutritionalStatuses ||
            (prog.nutritionalStatus ? [prog.nutritionalStatus] : []);

          const matchingChildren = children.filter((c) => {
            const last = c.measurements.slice(-1)[0];
            if (!last) return false;
            const ageMatch = Array.isArray(ages) && ages.includes(c.ageLevel);
            const statusMatch =
              Array.isArray(statuses) && statuses.includes(last.status);
            return ageMatch && statusMatch;
          });

          if (matchingChildren.length > 0) {
            found = true;
            const programStatus = getProgramStatus(prog.dateTime);
            const color = getProgramStatusColor(programStatus);
            const agesText = Array.isArray(ages) ? ages.join(", ") : ages;
            const statusesText = Array.isArray(statuses)
              ? statuses.join(", ")
              : statuses;
            const alreadyConfirmed = (db.attendance || []).some(
              (a) =>
                a.programId === prog.id && a.parentId === currentUser.data.id,
            );

            html += `<div class="card" style="border-left:4px solid ${color};">
        <div style="display:flex; justify-content:space-between;">
          <strong>${prog.title}</strong>
          <span class="badge" style="background:${color}; color:white;">${programStatus}</span>
        </div>
        <p style="margin:4px 0;"><strong>Type:</strong> ${prog.type}</p>
        <p style="margin:4px 0;"><strong>Date/Time:</strong> ${prog.dateTime}</p>
        <p style="margin:4px 0;"><strong>Location:</strong> ${prog.location}</p>
        <p style="margin:4px 0;"><strong>Age Groups:</strong> ${agesText}</p>
        <p style="margin:4px 0;"><strong>Nutritional Status:</strong> ${statusesText}</p>
        <p style="margin:4px 0;"><strong>Assigned to:</strong> ${matchingChildren.map((c) => c.firstName).join(", ")}</p>
        ${
          alreadyConfirmed
            ? `<button class="btn btn-small" disabled style="opacity:0.7;"><i class="fas fa-check"></i> Attendance Confirmed</button>`
            : `<button class="btn btn-small btn-success mt-2" onclick="confirmAttendance('${prog.id}')"><i class="fas fa-check"></i> Confirm Attendance</button>`
        }
      </div>`;
          }
        });

        if (!found)
          html += `<div class="card"><p>No upcoming health programs for your children.</p></div>`;
        document.getElementById("mainContent").innerHTML = html;
      }

      window.confirmAttendance = async function (progId) {
        const already = await (async () => {
          const db = await DB.get();
          return (db.attendance || []).some(
            (a) => a.programId === progId && a.parentId === currentUser.data.id,
          );
        })();
        if (already)
          return alert("You already confirmed attendance for this program.");

        const result = await safeMutate((db) => {
          if (!Array.isArray(db.attendance)) db.attendance = [];
          db.attendance.push({
            id: "att_" + Date.now(),
            programId: progId,
            parentId: currentUser.data.id,
            confirmedAt: new Date().toISOString(),
          });
        });
        if (!result) return alert("Could not confirm attendance.");
        alert("Attendance confirmed!");
        renderParentProgramsView();
      };

      function renderParentAccountSettings() {
        document.getElementById("mainContent").innerHTML = `
    <div class="card">
      <h3 style="color:#c62828;">Account Settings</h3>
      <label style="font-weight:600;">First Name</label>
      <input id="pFirstName" class="input-field" value="${currentUser.data.firstName}">
      <label style="font-weight:600;">Middle Name</label>
      <input id="pMiddleName" class="input-field" value="${currentUser.data.middleName || ""}">
      <label style="font-weight:600;">Last Name</label>
      <input id="pLastName" class="input-field" value="${currentUser.data.lastName}">
      <label style="font-weight:600;">Contact Number</label>
      <input id="pContact" class="input-field" value="${currentUser.data.contactNumber}">
      <label style="font-weight:600;">Email</label>
      <input id="pEmail" class="input-field" value="${currentUser.data.email || ""}">
      <label style="font-weight:600;">Address</label>
      <input id="pAddress" class="input-field" value="${currentUser.data.address}">
      <label style="font-weight:600;">Occupation</label>
      <input id="pOccupation" class="input-field" value="${currentUser.data.occupation}">
      <button class="btn mt-2" onclick="updateParentInfo()"><i class="fas fa-save"></i> Update Info</button>
    </div>
    <div class="card">
      <h4 style="color:#c62828;">Change Password</h4>
      <input id="pCurrentPass" type="password" class="input-field" placeholder="Current Password">
      <input id="pNewPass" type="password" class="input-field" placeholder="New Password">
      <input id="pConfirmPass" type="password" class="input-field" placeholder="Confirm New Password">
      <button class="btn mt-2" onclick="updateParentPassword()"><i class="fas fa-key"></i> Update Password</button>
    </div>
    <button class="btn btn-outline" onclick="navigate('parentChildren')"><i class="fas fa-arrow-left"></i> Back</button>`;
      }

      window.updateParentInfo = async function () {
        const result = await safeMutate((db) => {
          const parent = db.parents.find((p) => p.id === currentUser.data.id);
          if (!parent) return;
          parent.firstName = document.getElementById("pFirstName").value;
          parent.middleName = document.getElementById("pMiddleName").value;
          parent.lastName = document.getElementById("pLastName").value;
          parent.contactNumber = document.getElementById("pContact").value;
          parent.email = document.getElementById("pEmail").value;
          parent.address = document.getElementById("pAddress").value;
          parent.occupation = document.getElementById("pOccupation").value;
          currentUser.data = parent;
        });
        if (!result) return alert("Could not update account.");
        alert("Account updated successfully");
      };

      /* ───────────────────────── Boot ───────────────────────── */

      (async () => {
        try {
          await DB.init();
        } catch (e) {
          console.error("DB init failed:", e);
        }
        const sess = loadSession();
        if (sess && sess.role && sess.userId) {
          try {
            const db = await DB.get();
            if (sess.role === "admin") {
              const admin = db.admins.find((a) => a.id === sess.userId);
              if (admin) {
                currentUser = { role: "admin", data: admin };
                currentScreen = "dashboard";
              } else {
                clearSession();
              }
            } else if (sess.role === "parent") {
              const parent = db.parents.find((p) => p.id === sess.userId);
              if (parent && parent.verified) {
                currentUser = { role: "parent", data: parent };
                currentScreen = "parentChildren";
              } else {
                clearSession();
              }
            }
          } catch (e) {
            console.error("Session restore failed:", e);
            clearSession();
          }
        }

        renderApp();
      })();
    </script>
  </body>
</html>
